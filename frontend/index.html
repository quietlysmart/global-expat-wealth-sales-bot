<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Expat Wealth Sales Assistant</title>
    <link rel="stylesheet" href="/frontend/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <img src="/frontend/assets/logo.png" alt="Global Expat Wealth" class="logo" />
      <h1>Global Expat Wealth Sales Assistant</h1>

      <section class="chat-panel" aria-label="Chat">
        <div id="chatMessages" class="chat-messages"></div>
        <form id="chatForm" class="chat-form">
          <input id="userMessage" placeholder="Ask a question..." required />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/frontend/app.js"></script>
  </body>
</html>
