<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Expat Wealth Sales Assistant</title>
    <link rel="stylesheet" href="/frontend/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="loginPanel" class="auth-panel" aria-label="Login">
        <img src="/frontend/assets/logo.png" alt="Global Expat Wealth" class="logo" />
        <h1>Global Expat Wealth Sales Assistant</h1>
        <p class="auth-subtitle">
          AI concierge for qualifying prospects, handling objections, and guiding conversations toward a call with Dan.
        </p>
        <form id="loginForm" class="login-form">
          <input id="loginEmail" type="email" placeholder="Email" required />
          <input id="loginPassword" type="password" placeholder="Password" required />
          <button type="submit">Log in</button>
        </form>
        <p id="loginError" class="login-error" role="alert"></p>
        <p class="auth-note">
          This sales assistant can be connected to email, WhatsApp, or website chat widgets.
        </p>
      </section>

      <section id="chatPanel" class="chat-panel hidden" aria-label="Chat">
        <div class="chat-brand">
          <img src="/frontend/assets/logo.png" alt="Global Expat Wealth" class="chat-logo" />
          <h2>Global Expat Wealth Sales Assistant</h2>
        </div>
        <div class="chat-topbar">
          <div id="userBadge" class="user-badge"></div>
          <button id="logoutButton" class="logout-btn" type="button">Log out</button>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <form id="chatForm" class="chat-form">
          <input id="userMessage" placeholder="Ask a question..." required />
          <div class="record-button-container">
            <button
              id="voiceRecordButton"
              class="record-btn"
              type="button"
              aria-label="Hold to record voice message"
              title="Hold to record"
            >
              <span class="record-icon" aria-hidden="true">🎤</span>
            </button>
          </div>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/frontend/app.js"></script>
  </body>
</html>
